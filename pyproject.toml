[tool.poetry]
name = "tenderlens"
version = "0.1.0"
description = "Agentic AI for Kenya's public procurement transparency"
authors = ["Trevor Kayeyia Madara"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11"
pydantic-ai = ">=0.0.14"
mcp = ">=1.0.0"
httpx = ">=0.27.0"
tenacity = ">=8.5.0"
sqlalchemy = ">=2.0.0"
pandas = ">=2.2.0"
jsonschema = ">=4.23.0"
streamlit = ">=1.39.0"
groq = ">=0.11.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
pytest-asyncio = ">=0.23.0"
black = ">=24.0.0"
ruff = ">=0.6.0"



[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
